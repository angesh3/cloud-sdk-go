<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisco pxGrid Cloud Demo - Settings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .main-content {
            padding-top: 20px;
            padding-bottom: 20px;
        }
        body {
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-network-wired me-2"></i>
                Cisco pxGrid Cloud Demo
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fas fa-chart-line me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="settings.html">
                            <i class="fas fa-cog me-1"></i> Settings
                        </a>
                    </li>
                </ul>
                <div class="d-flex">
                    <span id="connection-status" class="badge bg-danger me-2">Disconnected</span>
                    <span id="tenant-badge" class="badge bg-secondary me-2">No Tenant</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid main-content">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Connection Settings</h5>
                    </div>
                    <div class="card-body">
                        <form id="settingsForm">
                            <div class="mb-3">
                                <label for="appId" class="form-label">App ID</label>
                                <input type="text" class="form-control" id="appId" placeholder="Your App ID">
                            </div>
                            <div class="mb-3">
                                <label for="apiKey" class="form-label">API Key</label>
                                <input type="password" class="form-control" id="apiKey" placeholder="Your API Key">
                                <small class="form-text text-muted">Enter your pxGrid Cloud API key here.</small>
                            </div>
                            <div class="mb-3">
                                <label for="readStream" class="form-label">Read Stream ID</label>
                                <input type="text" class="form-control" id="readStream" placeholder="Read Stream ID">
                            </div>
                            <div class="mb-3">
                                <label for="writeStream" class="form-label">Write Stream ID</label>
                                <input type="text" class="form-control" id="writeStream" placeholder="Write Stream ID">
                            </div>
                            <div class="mb-3">
                                <label for="groupId" class="form-label">Group ID</label>
                                <input type="text" class="form-control" id="groupId" placeholder="Group ID">
                            </div>
                            <button type="submit" class="btn btn-primary">Save Settings</button>
                        </form>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">Application Control</h5>
                    </div>
                    <div class="card-body">
                        <button id="restartBtn" class="btn btn-danger">Restart Application</button>
                        <small class="form-text text-muted d-block mt-2">Restart the application to apply changes. This will disconnect any active sessions.</small>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Tenant Management</h5>
                    </div>
                    <div class="card-body">
                        <div id="tenantInfo">
                            <p id="tenantStatus">No tenant linked</p>
                        </div>
                        <div id="tenantActions">
                            <div class="input-group mb-3" id="otpInput">
                                <input type="text" class="form-control" id="otpValue" placeholder="Enter OTP">
                                <button class="btn btn-outline-primary" type="button" id="linkTenantBtn">Link Tenant</button>
                            </div>
                            <button id="unlinkTenantBtn" class="btn btn-warning" style="display: none;">Unlink Tenant</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alerts -->
        <div class="alert-container position-fixed top-0 end-0 p-3" style="z-index: 1050">
            <div id="settingsAlert" class="alert alert-success alert-dismissible fade show d-none" role="alert">
                <span id="alertMessage"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load current settings
            fetchSettings();
            
            // Check tenant status
            checkTenantStatus();
            
            // Form submission handler
            const settingsForm = document.getElementById('settingsForm');
            settingsForm.addEventListener('submit', function(e) {
                e.preventDefault();
                saveSettings();
            });
            
            // Restart button handler
            const restartBtn = document.getElementById('restartBtn');
            restartBtn.addEventListener('click', function() {
                if (confirm('Are you sure you want to restart the application?')) {
                    restartApp();
                }
            });
            
            // Link tenant button handler
            const linkTenantBtn = document.getElementById('linkTenantBtn');
            linkTenantBtn.addEventListener('click', function() {
                const otp = document.getElementById('otpValue').value.trim();
                if (otp) {
                    linkTenant(otp);
                } else {
                    showAlert('Please enter an OTP', 'danger');
                }
            });
            
            // Unlink tenant button handler
            const unlinkTenantBtn = document.getElementById('unlinkTenantBtn');
            unlinkTenantBtn.addEventListener('click', function() {
                if (confirm('Are you sure you want to unlink the tenant?')) {
                    unlinkTenant();
                }
            });
        });
        
        async function fetchSettings() {
            try {
                const apiUrl = `/api/settings`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to fetch settings');
                
                const data = await response.json();
                
                // Populate form
                document.getElementById('appId').value = data.app.id || '';
                // Don't overwrite API key if masked
                if (data.app.apiKey && !data.app.apiKey.includes('*')) {
                    document.getElementById('apiKey').value = data.app.apiKey || '';
                }
                document.getElementById('readStream').value = data.app.readStream || '';
                document.getElementById('writeStream').value = data.app.writeStream || '';
                document.getElementById('groupId').value = data.app.groupId || '';
            } catch (error) {
                console.error('Error fetching settings:', error);
                showAlert('Failed to load settings: ' + error.message, 'danger');
            }
        }
        
        async function saveSettings() {
            // Get values from form
            const appId = document.getElementById('appId').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const readStream = document.getElementById('readStream').value.trim();
            const writeStream = document.getElementById('writeStream').value.trim();
            const groupId = document.getElementById('groupId').value.trim();
            
            // Create the settings object with the exact field names the backend expects
            const settings = {};
            
            if (appId) settings.appId = appId;
            if (apiKey) settings.apiKey = apiKey;
            if (readStream) settings.readStream = readStream;
            if (writeStream) settings.writeStream = writeStream;
            if (groupId) settings.groupId = groupId;
            
            try {
                console.log('Sending settings:', settings);
                const apiUrl = `/api/settings`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(settings)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to save settings');
                }
                
                const data = await response.json();
                showAlert(data.message || 'Settings saved successfully', 'success');
            } catch (error) {
                console.error('Error saving settings:', error);
                showAlert('Failed to save settings: ' + error.message, 'danger');
            }
        }
        
        async function restartApp() {
            try {
                const apiUrl = `/api/restart`;
                const response = await fetch(apiUrl, {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to restart application');
                }
                
                showAlert('Application is restarting...', 'info');
                
                // Wait and then try to reconnect
                setTimeout(() => {
                    window.location.reload();
                }, 5000);
            } catch (error) {
                console.error('Error restarting app:', error);
                showAlert('Failed to restart: ' + error.message, 'danger');
            }
        }
        
        async function checkTenantStatus() {
            try {
                const apiUrl = `/api/status`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to check status');
                
                const data = await response.json();
                
                // Update connection status
                const connectionStatus = document.getElementById('connection-status');
                if (connectionStatus) {
                    if (data.connected) {
                        connectionStatus.textContent = 'Connected';
                        connectionStatus.classList.remove('bg-danger');
                        connectionStatus.classList.add('bg-success');
                    } else {
                        connectionStatus.textContent = 'Disconnected';
                        connectionStatus.classList.remove('bg-success');
                        connectionStatus.classList.add('bg-danger');
                    }
                }
                
                // Update tenant badge
                const tenantBadge = document.getElementById('tenant-badge');
                if (tenantBadge) {
                    if (data.tenant) {
                        tenantBadge.textContent = data.tenant;
                        tenantBadge.classList.remove('bg-secondary');
                        tenantBadge.classList.add('bg-info');
                    } else {
                        tenantBadge.textContent = 'No Tenant';
                        tenantBadge.classList.remove('bg-info');
                        tenantBadge.classList.add('bg-secondary');
                    }
                }
                
                const tenantStatus = document.getElementById('tenantStatus');
                const unlinkTenantBtn = document.getElementById('unlinkTenantBtn');
                
                if (data.tenant) {
                    tenantStatus.textContent = `Linked to tenant: ${data.tenant}`;
                    unlinkTenantBtn.style.display = 'block';
                } else {
                    tenantStatus.textContent = 'No tenant linked';
                    unlinkTenantBtn.style.display = 'none';
                }
            } catch (error) {
                console.error('Error checking tenant status:', error);
            }
        }
        
        async function linkTenant(otp) {
            try {
                const apiUrl = `/api/tenant/link`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ otp })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to link tenant');
                }
                
                const data = await response.json();
                document.getElementById('otpValue').value = '';
                showAlert(`Successfully linked to tenant: ${data.name}`, 'success');
                checkTenantStatus();
            } catch (error) {
                console.error('Error linking tenant:', error);
                showAlert('Failed to link tenant: ' + error.message, 'danger');
            }
        }
        
        async function unlinkTenant() {
            try {
                const apiUrl = `/api/tenant/unlink`;
                const response = await fetch(apiUrl, {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to unlink tenant');
                }
                
                const data = await response.json();
                showAlert(data.message, 'success');
                checkTenantStatus();
            } catch (error) {
                console.error('Error unlinking tenant:', error);
                showAlert('Failed to unlink tenant: ' + error.message, 'danger');
            }
        }
        
        function showAlert(message, type) {
            const alertElement = document.getElementById('settingsAlert');
            const messageElement = document.getElementById('alertMessage');
            
            // Set the message and type
            messageElement.textContent = message;
            alertElement.className = `alert alert-${type} alert-dismissible fade show`;
            
            // Show the alert
            alertElement.classList.remove('d-none');
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                alertElement.classList.add('d-none');
            }, 5000);
        }
    </script>
</body>
</html>
