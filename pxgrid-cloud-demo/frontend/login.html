<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cisco pxGrid Cloud Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --cisco-blue: #005073;
            --cisco-light-blue: #0085C7;
            --cisco-accent: #0097A9;
        }
        
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .navbar {
            background-color: var(--cisco-blue);
        }
        
        .navbar-brand {
            color: white;
            font-weight: 500;
        }
        
        .login-container {
            max-width: 450px;
            margin: 2rem auto;
            padding: 2.5rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-top: 4px solid var(--cisco-light-blue);
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .form-control:focus {
            border-color: var(--cisco-light-blue);
            box-shadow: 0 0 0 0.25rem rgba(0, 133, 199, 0.25);
        }
        
        .btn-primary {
            background-color: var(--cisco-blue);
            border-color: var(--cisco-blue);
        }
        
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--cisco-light-blue);
            border-color: var(--cisco-light-blue);
        }
        
        footer {
            margin-top: auto;
            padding: 1rem 0;
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
            color: #6c757d;
        }
        .alert {
            display: none;
        }
        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #dee2e6;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        footer {
            margin-top: auto;
            padding: 1rem 0;
            text-align: center;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="fas fa-network-wired me-2"></i>
                Cisco pxGrid Cloud Demo
            </a>
        </div>
    </nav>

    <main class="container py-4">
        <div class="login-container">
            <div class="logo-container">
                <i class="fas fa-network-wired fa-3x mb-3" style="color: var(--cisco-blue);"></i>
                <h3 class="text-center mb-1">Welcome Back</h3>
                <p class="text-muted text-center mb-4">Please sign in to continue</p>
            </div>
            
            <div class="alert alert-danger" id="error-alert" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span id="error-message">Invalid credentials</span>
            </div>
                
            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username or email" required>
                    </div>
                </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                            <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i>
                            Sign In
                        </button>
                    </div>
                    
                    <div class="form-footer">
                        <p>Don't have an account? <a href="signup.html">Create one</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>© 2025 Cisco pxGrid Cloud Demo</p>
        </div>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Password visibility toggle
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            });
            
            // Get redirect URL from query params if available
            const urlParams = new URLSearchParams(window.location.search);
            const redirectURL = urlParams.get('redirect') || '';
            console.log('Redirect URL from params:', redirectURL);
            
            console.log('Login page loaded');
            
            // Check if we're in a redirect loop (more than 5 redirects in the last 10 seconds)
            const now = Date.now();
            const redirectHistory = JSON.parse(localStorage.getItem('redirect_history') || '[]');
            
            // Clean up old entries (older than 10 seconds)
            const recentRedirects = redirectHistory.filter(time => (now - time) < 10000);
            
            console.log('Recent redirects:', recentRedirects.length);
            
            if (recentRedirects.length >= 5) {
                console.error('Detected redirect loop! Clearing auth data and staying on login page');
                localStorage.removeItem('auth_token');
                localStorage.removeItem('user_data');
                localStorage.removeItem('redirect_history');
                // Show error message to the user
                document.getElementById('error-alert').style.display = 'block';
                document.getElementById('error-message').textContent = 'Redirect loop detected. Authentication data has been cleared. Please log in again.';
                // Don't redirect anywhere, stay on login page
            } else {
                // Record this redirect
                recentRedirects.push(now);
                localStorage.setItem('redirect_history', JSON.stringify(recentRedirects));
                
                // Check if user is already logged in
                const token = localStorage.getItem('auth_token');
                if (token) {
                    console.log('Found token, checking if valid...');
                    // Redirect to dashboard if already logged in
                    fetch('/api/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    })
                    .then(response => {
                        if (response.ok) {
                            return response.json();
                        } else {
                            // Clear invalid token and stay on login page
                            localStorage.removeItem('auth_token');
                            localStorage.removeItem('user_data');
                            throw new Error('Invalid authentication');
                        }
                    })
                    .then(user => {
                        console.log('Auth successful, redirecting based on role:', user.role);
                        // Determine where to redirect
                        if (redirectURL && redirectURL.startsWith('/admin')) {
                            if (user.role === 'admin') {
                                window.location.href = redirectURL;
                            } else {
                                window.location.href = 'index.html';
                            }
                        } else {
                            window.location.href = 'index.html';
                        }
                    })
                    .catch(error => {
                        console.error('Error checking authentication:', error);
                    });
                } else {
                    console.log('No authentication token found, showing login form');
                }
            }
            
            // Login form submission
            const loginForm = document.getElementById('login-form');
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                // Disable form during submission
                const submitButton = this.querySelector('button[type="submit"]');
                submitButton.disabled = true;
                submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing in...';
                
                // Hide any previous errors
                errorAlert.style.display = 'none';
                
                // FOR DEMO: Direct admin login override
                if (username === 'admin' && password === 'admin123') {
                    console.log('Using direct admin login override');
                    // Create a mock admin user and token
                    const adminUser = {
                        id: 'admin-user-1',
                        username: 'admin',
                        email: 'admin@example.com',
                        role: 'admin',
                        tenantAccess: []
                    };
                    
                    // Generate a mock token
                    const mockToken = 'admin-token-' + Math.random().toString(36).substring(2);
                    
                    // Store in localStorage
                    localStorage.setItem('auth_token', mockToken);
                    localStorage.setItem('user_data', JSON.stringify(adminUser));
                    localStorage.removeItem('redirect_history'); // Clear redirect history on successful login
                    
                    // Show success message briefly before redirecting
                    submitButton.innerHTML = '<i class="fas fa-check-circle me-2"></i>Login successful!';
                    submitButton.classList.replace('btn-primary', 'btn-success');
                    
                    setTimeout(() => {
                        // Check for redirect parameter
                        if (redirectURL && redirectURL.startsWith('/admin')) {
                            console.log('Redirecting admin to:', redirectURL);
                            // Go to admin dashboard directly (absolute path)
                            window.location.href = redirectURL;
                        } else {
                            // Redirect to index page instead of admin dashboard to avoid redirect loops
                            window.location.href = 'index.html';
                        }
                    }, 500);
                    return;
                }
                
                // Regular login flow
                console.log('Login attempt:', {
                    usernameOrEmail: username,
                    passwordLength: password.length
                });
                
                // Perform login request
                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usernameOrEmail: username,
                        password: password
                    })
                })
                .then(response => {
                    console.log('Login response status:', response.status);
                    return response.json().then(data => {
                        console.log('Login response data:', data);
                        return { status: response.status, data };
                    });
                })
                .then(({status, data}) => {
                    if (status !== 200 || data.error) {
                        throw new Error(data.error || 'Authentication failed');
                    }
                    
                    // Store authentication token and user data
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user_data', JSON.stringify(data.user));
                    
                    // Redirect based on user role and redirect parameter
                    if (data.user.role === 'admin') {
                        if (redirectURL && redirectURL.startsWith('/admin')) {
                            window.location.href = redirectURL;
                        } else {
                            window.location.href = 'admin/dashboard.html';
                        }
                    } else {
                        window.location.href = 'index.html';
                    }
                })
                .catch(error => {
                    console.error('Login error:', error);
                    errorMessage.textContent = error.message || 'Invalid username or password';
                    errorAlert.style.display = 'block';
                    
                    // Re-enable form
                    submitButton.disabled = false;
                    submitButton.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Sign In';
                });
            });
        });
    </script>
</body>
</html>
