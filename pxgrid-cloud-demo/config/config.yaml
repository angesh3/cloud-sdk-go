app:
  id: "your-app-id"  # Replace with your actual app ID
  apiKey: "your-api-key"  # Replace with your actual API key
  globalFQDN: "api.pxgrid.cisco.com"
  regionalFQDN: "api.pxgrid.cisco.com"
  regionalFQDNs:
    - "api.pxgrid.cisco.com"
  readStream: "your-read-stream-id"  # Replace with your actual read stream ID
  writeStream: "your-write-stream-id"  # Replace with your actual write stream ID
  groupId: "your-group-id"  # Replace with your actual group ID
tenant:
  # Leave OTP empty if you want to link a tenant through the UI
  otp: ""
  # Or fill these if you want to use existing tenant credentials
  id: ""
  name: ""
  token: ""
